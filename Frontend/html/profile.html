<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantnest | Profile</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

    <!-- Back Button (Top Left) -->
    <button type="button" class="back-btn" onclick="goBack()" aria-label="Go back to previous page">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
    </button>

    <!-- Main Profile Card -->
    <main class="profile-container">
        <h2 class="user-greeting">Profile</h2>

        <!-- Editable Name -->
        <div class="field-group">
            <label for="profileName">Name:</label>
            <input type="text" id="profileName" value="sanjeev" readonly>
            <button id="editNameBtn" type="button">Edit</button>
            <button id="saveNameBtn" type="button" style="display: none;">Save</button>
        </div>

        <!-- Read-only Email -->
        <div class="field-group">
            <label>Email:</label>
            <span id="profileEmail">sanjeev@gmail.com</span>
        </div>

        <!-- Read-only Phone -->
        <div class="field-group">
            <label>Phone Number:</label>
            <span id="profilePhone">6309818455</span>
        </div>

        <!-- Sign Out Button -->
        <button id="signOutBtn" type="button" class="btn danger-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Sign Out</span>
        </button>
    </main>

    <!-- Center-of-Center Popup Modal Box -->
    <div id="logoutModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </div>
            <h3 class="modal-title">Sign Out</h3>
            <p class="modal-message">
                Are you sure you want to sign out? You will need to log back in to access your profile.
            </p>
            <div class="modal-buttons">
                <button type="button" id="cancelLogoutBtn" class="modal-btn cancel-btn">Cancel</button>
                <button type="button" id="confirmLogoutBtn" class="modal-btn confirm-btn">Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="../js/profile.js"></script>
</body>
</html>
